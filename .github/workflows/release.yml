# Push a tag v<version> (same as package.json) → installers for macOS, Windows and Linux.
# Each system builds, then runs the packaged app's smoke test (both sites load in the app, Google sign-in hands off
# to the system browser and comes back). Files go to a draft release; it is published as "latest" (what the
# download page links to) only when every system passed.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "AI Architectures ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            app: dist/linux-unpacked/ai-architectures
            run: xvfb-run -a
            flags: --no-sandbox
          - os: windows-latest
            app: dist/win-unpacked/AI Architectures.exe
          - os: macos-latest
            app: dist/mac-universal/AI Architectures.app/Contents/MacOS/AI Architectures
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # macOS: signed with the Developer ID Application certificate (CSC_LINK, a base64 .p12) and notarized with an
      # App Store Connect API key (Developer role). Windows and Linux stay unsigned (owner decision).
      - name: App Store Connect API key for notarization
        if: matrix.os == 'macos-latest'
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
      - name: Build
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Notarize and staple the DMG, check Gatekeeper
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/mac-universal/AI Architectures.app"
          DMG=dist/AI-Architectures-mac-universal.dmg
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vv "$APP" 2>&1 | tee spctl-app.txt
          grep -q "source=Notarized Developer ID" spctl-app.txt
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 | tee spctl-dmg.txt
          grep -q "accepted" spctl-dmg.txt
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Smoke test the packaged app
        run: |
          ${{ matrix.run }} "${{ matrix.app }}" ${{ matrix.flags }} "--smoke-test=$PWD/smoke.json" || true
          cat smoke.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('smoke.json','utf8')).ok ? 0 : 1)"
        timeout-minutes: 5
      - name: Upload to the draft release
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish as latest
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
